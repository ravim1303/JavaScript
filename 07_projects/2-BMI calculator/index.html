<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #777;
        }

        nav {
            background-color: #eee;
            padding: 5px;
            text-align: center;
        }

        nav button {
            padding: 8px 30px;
            cursor: pointer;
        }

        .container {
            margin: 20px 25px;
        }

        h3 {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        input {
            width: 100px;
            height: 17px;
        }

        #calculate {
            display: block;
            margin: 30px auto 15px;
            padding: 2px 20px;
            font-size: 18px;
            background-color: white;
            border: 1px solid black;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            text-align: center;
            font-weight: bold;
            margin: 15px;
        }

        .guide {
            margin-left: 40px;
            line-height: 27px;
        }
    </style>

</head>

<body>

    <nav>
        <button>Home</button>
        <button>Youtube channel</button>
    </nav>

    <div class="container">

        <h3>BMI Calculator</h3>

        <div class="input-group">
            <label>Height in CM:</label>
            <input type="number" id="height">
        </div>

        <div class="input-group">
            <label>Weight in KG:</label>
            <input type="number" id="weight">
        </div>

        <button id="calculate" onclick="calculateBMI()">
            Calculate
        </button>

        <div id="result"></div>

        <div class="guide">

            <h4>BMI Weight Guide</h4>

            <p>Under Weight = Less than 18.5</p>

            <p>Normal Range = 18.5 and 24.9</p>

            <p>Overweight = Greater than 24.9</p>

        </div>

    </div>

    <!-- External JavaScript File -->
    <script src="calculator.js"></script>

</body>
</html>
